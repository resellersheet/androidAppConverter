plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services' // ✅ Step 2: Google Services plugin
}
android {
    namespace "com.themchat.app"
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.themchat.app"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 5
        versionName "1.4"
    }
    signingConfigs {
        release {
            storeFile file("keystore/release-key.jks")
            storePassword project.hasProperty('KEYSTORE_PASSWORD') ? project.property('KEYSTORE_PASSWORD') : ""
            keyAlias project.hasProperty('KEY_ALIAS') ? project.property('KEY_ALIAS') : ""
            keyPassword project.hasProperty('KEY_PASSWORD') ? project.property('KEY_PASSWORD') : ""
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {}
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // ✅ Step 1: Firebase Messaging (FCM)
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    // ✅ Step 3: Google Sign-In (for native Google login in WebView)
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
}
