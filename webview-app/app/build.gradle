plugins {
    id 'com.android.application'
}

android {
    namespace "com.yourdomain.webviewapp"  // fixed namespace (don't change dynamically)
    compileSdkVersion 33

    defaultConfig {
        // Placeholder applicationId — this will be replaced dynamically in CI/CD or local script
        applicationId "com.yourdomain.webviewapp.placeholder"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("keystore/release-key.jks")
            storePassword project.hasProperty('KEYSTORE_PASSWORD') ? project.property('KEYSTORE_PASSWORD') : ""
            keyAlias project.hasProperty('KEY_ALIAS') ? project.property('KEY_ALIAS') : ""
            keyPassword project.hasProperty('KEY_PASSWORD') ? project.property('KEY_PASSWORD') : ""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {}
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.9.0'

    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
