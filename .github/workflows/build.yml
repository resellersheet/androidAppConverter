name: Build WebView APK (Release Build)

on:
  workflow_dispatch:
    inputs:
      site_url:
        required: true
        type: string
      app_name:
        required: true
        type: string
      logo_url:
        required: true
        type: string
      account_id:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # Updated to v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17          # Better to use 17 for newer Gradle
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5       # Updated (7.6 is old)

      # ─────────────────────────────────────────────────────────────
      # FIXED: Generate Keystore Step
      # ─────────────────────────────────────────────────────────────
      - name: Generate Keystore
        run: |
          mkdir -p webview-app/app/keystore

          # Delete any existing keystore to prevent "alias already exists"
          rm -f webview-app/app/keystore/release-key.jks

          keytool -genkeypair -v \
            -keystore webview-app/app/keystore/release-key.jks \
            -alias ${{ secrets.KEY_ALIAS }} \
            -keyalg RSA \
            -keysize 2048 \
            -validity 20000 \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEYSTORE_PASSWORD }} \     # ← Same password (removes warning)
            -dname "CN=Albert Nfor, OU=themchat, O=themchat, L=Buea, ST=West, C=CM" \
            -noprompt   # Makes it non-interactive
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Print SHA1 & SHA256 (for verification)
        run: |
          keytool -list -v \
            -keystore webview-app/app/keystore/release-key.jks \
            -alias ${{ secrets.KEY_ALIAS }} \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} | grep -E "SHA1|SHA256"

      # Write signing config to gradle.properties
      - name: Write gradle.properties with keystore info
        run: |
          cat << EOF > webview-app/app/gradle.properties
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEYSTORE_PATH=keystore/release-key.jks
          EOF

      # Rest of your steps (slightly improved)
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Download user logo
        run: curl -L "${{ inputs.logo_url }}" -o logo.png

      - name: Resize and replace launcher icon
        run: |
          mkdir -p webview-app/app/src/main/res/mipmap-xxxhdpi
          convert logo.png -resize 192x192 webview-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Prepare splash logo
        run: |
          mkdir -p webview-app/app/src/main/res/drawable
          convert logo.png -resize 300x300 webview-app/app/src/main/res/drawable/your_logo.png

      - name: Set app name in strings.xml
        run: |
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ inputs.app_name }}</string>|" \
            webview-app/app/src/main/res/values/strings.xml

      - name: Replace site URL in strings.xml
        run: |
          sed -i "s|<string name=\"site_url\">.*</string>|<string name=\"site_url\">${{ inputs.site_url }}</string>|" \
            webview-app/app/src/main/res/values/strings.xml

      - name: Build Release APK
        working-directory: webview-app
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        working-directory: webview-app
        run: ./gradlew bundleRelease

      - name: Upload APK & AAB as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-build
          path: |
            webview-app/app/build/outputs/apk/release/app-release.apk
            webview-app/app/build/outputs/bundle/release/app-release.aab
